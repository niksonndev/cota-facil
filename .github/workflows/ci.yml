# Publica um SPA estático no GitHub Pages só depois de validar o build.
#
# Copie para .github/workflows/ci.yml e ajuste: gerenciador de pacotes,
# branch de produção (aqui 'main' — confira o branch real do repo) e o
# caminho do validador do PWA.
#
# Dois jobs de propósito: o de qualidade compila COM as secrets e publica o
# dist como artefato; o de deploy baixa exatamente esse artefato em vez de
# recompilar — o mesmo build que passou na validação do PWA é o que vai ao ar.
#
# Antes do primeiro push, habilite o Pages uma vez:
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
# Depois do deploy, verifique a URL publicada (não só o local): manifest pela
# Chrome (Page.getAppManifest -> errors: []), SW com escopo /<repo>/ controlando
# a página, cache populado e um deep link direto.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um run por branch: pushes em sequência cancelam o anterior em vez de acumular.
# (O job de deploy tem o próprio grupo, sem cancelamento — ver abaixo.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, testes, build e PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          # Escolha uma versão que satisfaça os engines do lint/test (ex.:
          # eslint 10 pede ^20.19 || ^22.13 || >=24; jsdom 30 pede >=22.22).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      # VITE_* vão embutidas no bundle pelo build: não são segredo de verdade,
      # mas ficam em secrets para não versionar credencial nenhuma. Sem elas o
      # build passa e só avisa — quem quebra é o app em execução.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::warning title=Credenciais ausentes::Configure as secrets em Settings > Secrets and variables > Actions. O app foi compilado sem credenciais e não vai conectar."
          fi
          pnpm build

      - name: Validar o PWA gerado
        run: node scripts/check-pwa.mjs

      - name: Publicar o dist como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Só publica em push no branch de produção: PR não mexe no site.
  deploy:
    name: Publicar no GitHub Pages
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Deploy não cancela o anterior: dois deploys simultâneos colidem no Pages.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o dist gerado no job de qualidade
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
